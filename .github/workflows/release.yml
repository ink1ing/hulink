name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 仅发布源码版（GitHub 自动附带源码 zip/tar.gz）；可执行程序由开发者用 packaging/ 脚本自建
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
