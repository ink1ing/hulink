name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 复制共享核心到移动端
        run: cp converter.py mobile/converter.py
      - name: Buildozer 构建 APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: mobile
          command: buildozer android debug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: hulink-apk
          path: mobile/bin/*.apk
